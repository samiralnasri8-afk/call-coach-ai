<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Real Estate Call Coach</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 20px;
}

.card {
  background: #151c30;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 15px;
  border: 1px solid #27314d;
}

.status {
  text-align: center;
  padding: 12px;
  border-radius: 10px;
  background: #202941;
  margin-bottom: 15px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

.start {
  background: #16a34a;
  color: white;
}

.stop {
  background: #dc2626;
  color: white;
}

.clear {
  background: #374151;
  color: white;
}

.speaker {
  background: #2563eb;
  color: white;
}

.speaker.active {
  outline: 3px solid #93c5fd;
}

.label {
  font-size: 13px;
  color: #9ca3af;
  margin-bottom: 8px;
}

.content {
  font-size: 18px;
  line-height: 1.5;
  min-height: 45px;
}

.say {
  font-size: 22px;
  font-weight: bold;
  line-height: 1.5;
  color: #86efac;
}

.next {
  font-size: 18px;
  color: #93c5fd;
}

.transcript {
  white-space: pre-wrap;
  line-height: 1.5;
  color: #d1d5db;
}

.review {
  line-height: 1.6;
  color: #e5e7eb;
}

.small {
  color: #9ca3af;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎧 AI Real Estate Call Coach</h1>

<div class="subtitle">
Live Wholesaling Call Assistant
</div>

<div class="card">

<div id="status" class="status">
Ready — choose who is speaking and start listening.
</div>

<div style="text-align:center">

<button class="speaker active" id="sellerBtn"
onclick="setSpeaker('seller')">
👤 SELLER / BUYER
</button>

<button class="speaker" id="meBtn"
onclick="setSpeaker('me')">
🧑 ME
</button>

</div>

<div style="text-align:center;margin-top:10px">

<button class="start" onclick="startListening()">
🎙️ Start Listening
</button>

<button class="stop" onclick="stopListening()">
⏹ Stop
</button>

<button class="clear" onclick="clearAll()">
🗑 Clear
</button>

</div>

</div>


<div class="card">

<div class="label">
👤 WHAT THEY SAID
</div>

<div id="spokenText" class="content">
Waiting...
</div>

</div>


<div class="card">

<div class="label">
🇸🇴 MEANING
</div>

<div id="meaning" class="content">
Waiting...
</div>

</div>


<div class="card">

<div class="label">
🗣️ ONLY WHAT TO SAY
</div>

<div id="say" class="say">
Waiting...
</div>

</div>


<div class="card">

<div class="label">
📝 TRANSCRIPT
</div>

<div id="transcript" class="transcript">
No conversation yet.
</div>

</div>


<div class="card">

<div class="label">
📊 CALL REVIEW
</div>

<div id="review" class="review">
Your call review will appear here after the conversation.
</div>

</div>

</div>


<script>

let recognition;
let listening = false;
let currentSpeaker = "seller";

let conversation = [];


function setSpeaker(speaker) {

currentSpeaker = speaker;

document.getElementById("sellerBtn")
.classList.toggle("active", speaker === "seller");

document.getElementById("meBtn")
.classList.toggle("active", speaker === "me");

if (speaker === "seller") {

document.getElementById("status").innerText =
"Listening for SELLER / BUYER...";

} else {

document.getElementById("status").innerText =
"Listening for ME...";

}

}


function startListening() {

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if (!SpeechRecognition) {

alert(
"Speech recognition is not supported in this browser. Please use Google Chrome."
);

return;
}

recognition = new SpeechRecognition();

recognition.lang = "en-US";

recognition.continuous = true;

recognition.interimResults = true;

recognition.onstart = function() {

listening = true;

document.getElementById("status").innerText =
"🎙️ Listening...";

};


recognition.onresult = function(event) {

let finalText = "";

for (
let i = event.resultIndex;
i < event.results.length;
i++
) {

let text = event.results[i][0].transcript;

if (event.results[i].isFinal) {

finalText += text;

}

}

if (finalText.trim() !== "") {

processSpeech(finalText.trim());

}

};


recognition.onerror = function(event) {

document.getElementById("status").innerText =
"Microphone error: " + event.error;

};


recognition.onend = function() {

if (listening) {

try {
recognition.start();
} catch(e) {}

}

};

recognition.start();

}


function stopListening() {

listening = false;

if (recognition) {

recognition.stop();

}

document.getElementById("status").innerText =
"Stopped.";

}


function processSpeech(text) {

if (currentSpeaker === "seller") {

conversation.push({
speaker: "SELLER / BUYER",
text: text
});

document.getElementById("spokenText").innerText =
text;

generateCoachResponse(text);

} else {

conversation.push({
speaker: "ME",
text: text
});

document.getElementById("spokenText").innerText =
"Your speech: " + text;

document.getElementById("meaning").innerText =
"Your statement has been added to the call transcript.";

document.getElementById("say").innerText =
"Continue listening to the seller / buyer.";

}

updateTranscript();

updateReview();

}


function generateCoachResponse(text) {

let lower = text.toLowerCase();

let meaning =
"I understand that the seller / buyer is talking about the property.";

let say =
"Thanks for explaining that. Can you tell me a little more about the property?";


if (
lower.includes("price") ||
lower.includes("asking") ||
lower.includes("want") &&
lower.includes("dollar")
) {

meaning =
"They are talking about the price they want for the property.";

say =
"I understand. Is the price negotiable?";

}


else if (
lower.includes("condition") ||
lower.includes("repair") ||
lower.includes("needs work")
) {

meaning =
"They are talking about the condition or repairs needed on the property.";

say =
"What repairs does the property need right now?";

}


else if (
lower.includes("tenant") ||
lower.includes("rented") ||
lower.includes("rent")
) {

meaning =
"They are talking about a tenant or rental situation.";

say =
"Is the property currently occupied by a tenant?";

}


else if (
lower.includes("mortgage") ||
lower.includes("loan")
) {

meaning =
"They are talking about a mortgage or loan on the property.";

say =
"Is there currently a mortgage or loan on the property?";

}


else if (
lower.includes("move") ||
lower.includes("moving")
) {

meaning =
"They are talking about moving or their plans for the property.";

say =
"When would you ideally like to sell the property?";

}


else if (
lower.includes("close") ||
lower.includes("closing")
) {

meaning =
"They are talking about the closing process or timing.";

say =
"What closing date would work best for you?";

}


else if (
lower.includes("offer")
) {

meaning =
"They are talking about an offer.";

say =
"I understand. Before I talk numbers, can I ask a few questions about the property?";

}


else if (
lower.includes("why") &&
lower.includes("sell")
) {

meaning =
"They are asking about the reason for selling.";

say =
"I understand. What is the main reason you are considering selling?";

}


else if (
lower.includes("cash")
) {

meaning =
"They are talking about a cash purchase or cash offer.";

say =
"I understand. Are you mainly looking for a quick cash sale?";

}


else if (
lower.includes("agent") ||
lower.includes("realtor")
) {

meaning =
"They are talking about using a real estate agent.";

say =
"Are you currently working with an agent on the property?";

}


else if (
lower.includes("no") ||
lower.includes("not interested")
) {

meaning =
"They may not be interested in selling right now.";

say =
"I understand. Would it be okay if I asked what would make a sale worthwhile for you?";

}


document.getElementById("meaning").innerText =
meaning;

document.getElementById("say").innerText =
say;

}


function updateTranscript() {

let output = "";

for (let item of conversation) {

if (item.speaker === "SELLER / BUYER") {

output +=
"👤 SELLER / BUYER:\n" +
item.text +
"\n\n";

} else {

output +=
"🧑 ME:\n" +
item.text +
"\n\n";

}

}

document.getElementById("transcript").innerText =
output;

}


function updateReview() {

let sellerCount = 0;

let meCount = 0;

for (let item of conversation) {

if (item.speaker === "SELLER / BUYER") {

sellerCount++;

} else {

meCount++;

}

}

document.getElementById("review").innerHTML =

"<strong>Conversation summary</strong><br><br>" +

"Seller / Buyer statements: " +
sellerCount +
"<br>" +

"Your statements: " +
meCount +
"<br><br>" +

"<strong>Coach:</strong><br>" +

"Keep asking about motivation, property condition, price, timeline, occupancy, and any mortgage or liens before discussing a final deal.";

}


function clearAll() {

conversation = [];

document.getElementById("spokenText").innerText =
"Waiting...";

document.getElementById("meaning").innerText =
"Waiting...";

document.getElementById("say").innerText =
"Waiting...";

document.getElementById("transcript").innerText =
"No conversation yet.";

document.getElementById("review").innerText =
"Your call review will appear here after the conversation.";

document.getElementById("status").innerText =
"Ready.";

}


</script>

</body>
</html>
